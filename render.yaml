services:
  - type: web
    name: disruption-negotiator
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/config
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TYPESAFE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL_POOLED   # Neon pooler URL; the app serves from files when unset or unreachable
        sync: false
